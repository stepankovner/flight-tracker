name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      - name: Бандл Worker собирается
        run: npx wrangler deploy --dry-run --outdir dist

  # Деплой на push в main. Нужны секреты репозитория CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID
  # (см. README → «Автодеплой из GitHub»). Без них job просто пропускает шаги.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Нет токена Cloudflare — пропускаем
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN не задан — автодеплой отключён"
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - name: Миграции D1
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply farewatch --remote
      - name: Деплой Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
